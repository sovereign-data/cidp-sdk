[project]
name = "cidp-sdk"
version = "0.3.0"
description = "Python SDK and CLI for CIDP, the cloud independent data platform (/api/data/v1): workspaces, catalogs, statements, jobs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.7",
    "pyarrow>=18.0",
    # The refresh token of a browser login lives in the OS keyring, never in a file (design A5).
    "keyring>=25.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
# client.iceberg(ws): a pyiceberg REST catalog on the public Polaris URI with vended credentials (design A6).
iceberg = ["pyiceberg>=0.9"]
# The cidp command (OpenSpec change data-cli): typer, as Chameleon's CLI; rich comes with it.
cli = ["typer>=0.27"]

[project.scripts]
cidp = "cidp_sdk.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cidp_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/cidp_sdk", "tests", "scripts", "contract", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "cidp-sdk[pandas,iceberg,cli]",
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.uv.sources]
cidp-sdk = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 122
# The package supports 3.12: no newer syntax here.
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
# Generated by scripts/sdk_models.py (make sdk-models); the SDK tests compare it with the contract byte for byte.
exclude = ["src/cidp_sdk/_models.py", "src/cidp_sdk/_operations.py", "*.md"]

[tool.ruff.lint]
# S: flake8-bandit, as in the data service; S101 is off (asserts narrow types).
select = ["E", "F", "I", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S603", "S607"]
